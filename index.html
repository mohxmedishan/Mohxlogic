<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>mohxlogic — alpha</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; color: #171717; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { position: fixed; inset: 0; background-color: #fff; background-image: linear-gradient(to right, #eeeeee 1px, transparent 1px), linear-gradient(to bottom, #eeeeee 1px, transparent 1px); background-size: 32px 32px; background-position: 0 0; cursor: grab; touch-action: none; }
    .canvas.dragging { cursor: grabbing; }
    .canvas::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(255,255,255,.7) 100%); }
    .topbar { position: fixed; top: 22px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; z-index: 2; pointer-events: none; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #171717; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: -.5px; }
    .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -.35px; }
    .version { padding: 5px 9px; border: 1px solid #e5e5e5; border-radius: 999px; color: #777; background: rgba(255,255,255,.8); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .status { position: fixed; top: 72px; left: 24px; color: #aaa; font-size: 11px; letter-spacing: .04em; z-index: 2; pointer-events: none; }
    .tools { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; padding: 5px; gap: 4px; background: rgba(255,255,255,.94); border: 1px solid #e7e7e7; box-shadow: 0 8px 30px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04); border-radius: 999px; z-index: 3; backdrop-filter: blur(12px); }
    .tool { width: 54px; height: 46px; border: 0; border-radius: 999px; display: grid; place-items: center; background: transparent; color: #8a8a8a; cursor: pointer; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .tool:hover { background: #f4f4f4; color: #222; }
    .tool:active { transform: scale(.94); }
    .tool.active { background: #171717; color: #fff; }
    .tool svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hint { display: none; }
    .zoom { position: fixed; right: 24px; bottom: 26px; display: flex; align-items: center; gap: 3px; padding: 5px; border: 1px solid #e7e7e7; border-radius: 999px; background: rgba(255,255,255,.94); box-shadow: 0 8px 30px rgba(0,0,0,.07); backdrop-filter: blur(12px); z-index: 3; }
    .zoom button { width: 34px; height: 34px; border: 0; background: transparent; color: #555; border-radius: 50%; cursor: pointer; font-size: 18px; display: grid; place-items: center; }
    .zoom button:hover { background: #f3f3f3; color: #111; }
    .inventory-panel { position: fixed; left: 18px; top: 112px; bottom: 94px; width: 24vw; min-width: 240px; max-width: 420px; z-index: 5; display: none; background: rgba(255,255,255,.94); border: 1px solid #e6e6e6; border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.09); backdrop-filter: blur(16px); overflow: hidden; }
    .inventory-panel.open { display: flex; flex-direction: column; }
    .inventory-header { padding: 16px 18px; border-bottom: 1px solid #ededed; display: flex; align-items: center; justify-content: space-between; }
    .inventory-title { font-size: 12px; font-weight: 650; letter-spacing: .02em; }
    .inventory-empty { flex: 1; display: grid; place-items: center; color: #b0b0b0; font-size: 11px; }
    .inventory-resize { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: ew-resize; touch-action: none; }
    .inventory-resize::after { content: ""; position: absolute; top: 50%; right: 2px; transform: translateY(-50%); height: 36px; width: 2px; border-radius: 4px; background: #d5d5d5; }
    .inventory-toggle { border: 1px solid #e7e7e7; background: rgba(255,255,255,.9); border-radius: 999px; padding: 6px 10px; font-size: 10px; color: #777; cursor: pointer; }
    .inventory-show { position: fixed; left: 18px; top: 112px; z-index: 5; border: 1px solid #e6e6e6; border-radius: 999px; padding: 9px 13px; background: rgba(255,255,255,.95); box-shadow: 0 8px 24px rgba(0,0,0,.08); color: #555; font-size: 11px; cursor: pointer; display: none; backdrop-filter: blur(12px); }
    .inventory-show.visible { display: block; }
    .shop-button { position: fixed; left: calc(50% - 125px); bottom: 26px; width: 56px; height: 56px; border: 1px solid #e7e7e7; border-radius: 50%; background: rgba(255,255,255,.95); color: #555; display: grid; place-items: center; z-index: 4; box-shadow: 0 8px 30px rgba(0,0,0,.08); cursor: pointer; backdrop-filter: blur(12px); }
    .shop-button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .shop-overlay { position: fixed; inset: 20px; z-index: 20; background: rgba(255,255,255,.98); border: 1px solid #e6e6e6; border-radius: 20px; box-shadow: 0 20px 70px rgba(0,0,0,.12); display: none; overflow: hidden; }
    .shop-overlay.open { display: flex; }
    .shop-main { min-width: 0; flex: 0 0 65%; display: flex; flex-direction: column; }
    .shop-overlay.has-details .shop-main { flex-basis: 65%; }
    .shop-header { height: 64px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; flex-shrink: 0; }
    .shop-heading { font-size: 15px; font-weight: 650; }
    .shop-close { width: 34px; height: 34px; border: 1px solid #e7e7e7; border-radius: 50%; background: #fff; color: #666; cursor: pointer; font-size: 18px; }
    .shop-grid-wrap { padding: 18px; overflow-y: auto; flex: 1; touch-action: pan-y; overscroll-behavior: contain; }
    .shop-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .shop-card { border: 1px solid #e8e8e8; background: #fff; border-radius: 13px; padding: 14px; min-height: 138px; display: flex; flex-direction: column; text-align: left; cursor: pointer; transition: border-color .18s ease, background-color .18s ease; touch-action: manipulation; }
    .shop-card:hover,.shop-card.selected { border-color: #bdbdbd; background: #fafafa; }
    .shop-card-icon { height: 48px; display: grid; place-items: center; color: #777; font-size: 22px; }
    .shop-card-name { font-size: 12px; font-weight: 600; }
    .shop-card-desc { margin-top: 5px; font-size: 10px; line-height: 1.45; color: #999; }
    .shop-details { flex: 1 1 35%; border-left: 1px solid #eee; display: flex; flex-direction: column; min-width: 0; background: #fcfcfc; }
    .shop-detail-head { height: 64px; padding: 0 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .shop-detail-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .08em; }
    .shop-detail-body { padding: 24px 20px; overflow-y: auto; }
    .shop-empty-state { height: 100%; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #999; gap: 10px; }
    .shop-empty-icon { width: 64px; height: 64px; display: grid; place-items: center; border: 1px solid #eee; border-radius: 16px; background: #fff; color: #aaa; font-size: 26px; }
    .shop-empty-title { font-size: 13px; font-weight: 600; color: #777; }
    .shop-empty-copy { max-width: 190px; font-size: 11px; line-height: 1.5; }
    .shop-detail-icon { height: 92px; display: grid; place-items: center; font-size: 36px; color: #777; border: 1px solid #eee; border-radius: 14px; background: #fff; margin-bottom: 20px; }
    .shop-detail-name { font-size: 16px; font-weight: 650; }
    .shop-detail-description { margin-top: 10px; color: #888; font-size: 12px; line-height: 1.6; }
    .shop-detail-bottom { margin-top: auto; border-top: 1px solid #eee; padding: 16px 20px; color: #888; font-size: 11px; line-height: 1.5; }
    .shop-buy { width: 100%; margin-top: 14px; padding: 12px 14px; border: 0; border-radius: 10px; background: #171717; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .16s ease, transform .16s ease, box-shadow .16s ease; }
    .shop-buy:hover { background: #333; box-shadow: 0 6px 16px rgba(0,0,0,.12); transform: translateY(-1px); }
    .shop-buy:active { transform: translateY(0) scale(.98); }
    .shop-buy:disabled { background: #e5e5e5; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
    .shop-buy-note { margin-top: 8px; min-height: 14px; font-size: 10px; color: #999; text-align: center; }
    
    .shop-overlay { inset: 24px; }
    .shop-close { position:absolute; top:12px; right:12px; z-index:5; }
    .shop-header { justify-content:flex-start; padding-right:58px; }
    .shop-card-price { margin-top:auto; padding-top:9px; font-size:10px; font-weight:600; color:#666; }
    .shop-card-owned { margin-top:4px; font-size:10px; color:#999; }
    .shop-buy-note { color:#777; }
    .world-layer { position:fixed; inset:0; z-index:1; pointer-events:none; transform-origin:0 0; }
    .sell-zone { position:absolute; width:160px; height:160px; border:2px dashed #777; background:rgba(255,255,255,.75); display:grid; place-items:center; text-align:center; color:#555; font-size:11px; letter-spacing:.08em; font-weight:600; }
    .machine { position:absolute; width:32px; height:32px; display:grid; place-items:center; border:1px solid #888; border-radius:6px; background:rgba(255,255,255,.96); color:#555; font-size:17px; box-shadow:0 3px 8px rgba(0,0,0,.08); pointer-events:auto; cursor:pointer; user-select:none; }
    .machine.conveyor { background:#f7f7f7; }
    .machine.extractor { background:#fff8ed; border-color:#d8ad76; color:#9b6b29; }
    .ghost-machine { opacity:.5; outline:2px dashed #777; pointer-events:none; }
    .place-actions { position:absolute; display:flex; gap:5px; transform:translate(-50%,-100%); margin-top:-10px; pointer-events:auto; }
    .place-actions button { width:30px;height:30px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#444;box-shadow:0 4px 10px rgba(0,0,0,.1);font-size:15px;cursor:pointer; }
    .mp-counter { position:fixed; right:24px; top:72px; z-index:3; padding:8px 12px; border:1px solid #e5e5e5; border-radius:999px; background:rgba(255,255,255,.9); font-size:11px; color:#555; }
    .game-toast { position:fixed; left:50%; top:80px; transform:translateX(-50%); z-index:30; padding:9px 14px; border:1px solid #e7e7e7; border-radius:999px; background:rgba(255,255,255,.97); color:#666; font-size:11px; opacity:0; pointer-events:none; transition:opacity .2s; }
    .game-toast.show { opacity:1; }
    .erase-actions button { border-color:#e3c3c3; color:#a44; }
    @media(max-width:700px) { .shop-overlay { inset:18px; } .shop-close {top:8px;right:8px;} .mp-counter {right:14px;top:62px;} .place-actions button {width:32px;height:32px;} }
    @media(max-width:700px) { .shop-button { bottom: 20px; left: calc(50% - 111px); width: 52px; height: 52px; } .shop-overlay { inset: 14px; border-radius: 16px; } .shop-grid { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; } .shop-card { min-height: 112px; padding: 9px; } .shop-card-icon { height: 34px; font-size: 18px; } .shop-card-name { font-size: 10px; } .shop-card-desc { font-size: 9px; } .shop-overlay.has-details .shop-main { flex-basis: 65%; } .shop-details { flex-basis: 35%; } .shop-detail-body { padding: 12px; } .shop-detail-icon { height: 66px; font-size: 28px; } .shop-detail-name { font-size: 13px; } .shop-detail-description { font-size: 10px; } .shop-detail-bottom { padding: 12px; font-size: 10px; } .shop-empty-icon { width: 48px; height: 48px; font-size: 20px; } .shop-empty-copy { font-size: 9px; } .shop-buy { padding: 10px; font-size: 11px; } .shop-header { padding: 0 12px; } .shop-grid-wrap { padding: 10px; } }
    @media(max-width:380px) { .shop-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .shop-overlay.has-details .shop-main { flex: 0 0 52%; } .shop-details { flex-basis: 48%; } }

    @media (max-width: 520px) { .inventory-panel { left: 10px; top: 96px; bottom: 86px; width: min(78vw, 320px); min-width: 200px; max-width: 78vw; } }
    .zoom-value { min-width: 42px; text-align: center; font-size: 11px; color: #777; font-variant-numeric: tabular-nums; cursor: pointer; }
    @media (max-width: 520px) { .topbar { top: 16px; left: 16px; right: 16px; } .status { left: 16px; top: 62px; } .hint { display: none; } .tools { bottom: 20px; } .zoom { right: 12px; bottom: 20px; } .tool { width: 44px; height: 42px; } }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Grid canvas"></main>
  <header class="topbar">
    <div class="brand"><div class="mark">m.</div><div class="brand-name">mohxlogic</div></div>
    <div class="version">alpha · 01</div>
  </header>
  <div class="status">Untitled canvas</div>
  <div class="mp-counter" id="mpCounter">20 MP</div>
  <div class="game-toast" id="gameToast"></div>
  <div class="world-layer" id="worldLayer"><div class="sell-zone" id="sellZone">SELL ZONE<br>5 × 5</div></div>
  <aside class="inventory-panel" id="inventoryPanel" aria-label="Inventory panel">
    <div class="inventory-header"><span class="inventory-title">INVENTORY</span><button class="inventory-toggle" id="inventoryToggle">Hide</button></div>
    <div class="inventory-empty">Inventory is empty</div>
    <div class="inventory-resize" id="inventoryResize" aria-label="Resize inventory panel"></div>
  </aside>

  <button class="inventory-show" id="inventoryShow" type="button">Show inventory</button>
  <button class="shop-button" id="shopButton" title="Shop" aria-label="Open shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.5L21 8H6"/><circle cx="9.5" cy="20" r="1"/><circle cx="17.5" cy="20" r="1"/></svg></button>
  <section class="shop-overlay" id="shopOverlay" aria-label="Shop window">
    <div class="shop-main">
      <header class="shop-header"><div class="shop-heading">Shop</div></header><button class="shop-close" id="shopClose" aria-label="Close shop">×</button>
      <div class="shop-grid-wrap"><div class="shop-grid" id="shopGrid"></div></div>
    </div>
    <aside class="shop-details" id="shopDetails">
      <header class="shop-detail-head"><span class="shop-detail-label">Item details</span></header>
      <div class="shop-detail-body" id="shopDetailBody"><div class="shop-empty-state"><div class="shop-empty-icon">⌑</div><div class="shop-empty-title">Select an item</div><div class="shop-empty-copy">Choose something from the catalog to see its details here.</div></div></div>
      <div class="shop-detail-bottom">Placeholder item · Items and prices will be added later.<button class="shop-buy" id="shopBuy" disabled>Buy item</button><div class="shop-buy-note" id="shopBuyNote"></div></div>
    </aside>
  </section>
  <nav class="tools" aria-label="Canvas tools">
    <button class="tool active" data-tool="build" aria-label="Hammer tool" title="Hammer">
      <svg viewBox="0 0 24 24"><path d="m14.5 6.5 3-3 3 3-3 3"/><path d="m13 8 7-7"/><path d="m12.5 8.5 3 3-8.8 8.8a2.1 2.1 0 0 1-3-3L12.5 8.5Z"/></svg>
    </button>
    <button class="tool" data-tool="erase" aria-label="Dustbin tool" title="Dustbin">
      <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="m6.5 7 .9 13h9.2l.9-13"/><path d="M9 7V4h6v3"/><path d="M10 10v7M14 10v7"/></svg>
    </button>
  </nav>
  <div class="zoom" aria-label="Zoom controls">
    <button id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
    <span class="zoom-value" id="zoomValue" title="Reset zoom and position">100%</span>
    <button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
  </div>
  <script>
    const canvas = document.querySelector('.canvas');
    const inventoryPanel = document.querySelector('#inventoryPanel');
    const inventoryToggle = document.querySelector('#inventoryToggle');
    const inventoryResize = document.querySelector('#inventoryResize');
    const inventoryShow = document.querySelector('#inventoryShow');
    const buildTool = document.querySelector('[data-tool="build"]');
    const shopButton = document.querySelector('#shopButton');
    const shopOverlay = document.querySelector('#shopOverlay');
    const shopGrid = document.querySelector('#shopGrid');
    const shopDetailBody = document.querySelector('#shopDetailBody');
    const shopDetails = document.querySelector('#shopDetails');
    const worldLayer = document.querySelector('#worldLayer');
    const sellZone = document.querySelector('#sellZone');
    const mpCounter = document.querySelector('#mpCounter');
    const gameToast = document.querySelector('#gameToast');
    let inventoryOpen = true;
    function setInventoryOpen(open) {
      inventoryOpen = open;
      const isBuild = buildTool.classList.contains('active');
      inventoryPanel.classList.toggle('open', open && isBuild);
      inventoryShow.classList.toggle('visible', !open && isBuild);
      inventoryToggle.textContent = 'Hide';
    }
    inventoryToggle.addEventListener('click', () => setInventoryOpen(false));
    inventoryShow.addEventListener('click', () => setInventoryOpen(true));
    const placeholderItems = [
      {id:'conveyor-straight',name:'Conveyor Straight',icon:'⇢',description:'A straight conveyor segment for transporting items.',price:2,type:'conveyor'},
      {id:'conveyor-turn',name:'Conveyor Turn',icon:'↱',description:'A turning conveyor segment for changing item direction.',price:2,type:'conveyor'},
      {id:'manual-extractor',name:'Manual Extractor',icon:'⛏',description:'Click it to produce 1 MP. Has a 2-second cooldown between uses.',price:10,type:'extractor'}
    ];
    let selectedShopItem = null;
    let mp = 20;
    const inventoryCounts = Object.fromEntries(placeholderItems.map(item=>[item.id,0]));
    const machines = [];
    let placement = null, eraseSelection = null, toastTimer = null;
    const priceFmt = v => v+' MP';
    function toast(msg) { gameToast.textContent=msg; gameToast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>gameToast.classList.remove('show'),1900); }
    function updateMoney() { mpCounter.textContent=mp+' MP'; }
    function worldOrigin(){return {x:Math.floor(innerWidth/2/32)*32,y:Math.floor(innerHeight/2/32)*32};}
    function gridCoords(clientX,clientY){const o=worldOrigin();return {x:Math.round((clientX-o.x-offsetX)/zoom/32),y:Math.round((clientY-o.y-offsetY)/zoom/32)};}
    function renderWorld(){const o=worldOrigin();worldLayer.style.transform='translate('+(o.x+offsetX)+'px,'+(o.y+offsetY)+'px) scale('+zoom+')';sellZone.style.left='-80px';sellZone.style.top='-80px';machines.forEach(m=>{m.el.style.left=(m.x*32-16)+'px';m.el.style.top=(m.y*32-16)+'px';m.el.style.transform='rotate('+m.rotation*90+'deg)';});if(placement)renderGhost();if(eraseSelection)renderEraseActions();}
    function inSellZone(x,y){return x>=-2&&x<=2&&y>=-2&&y<=2;}
    function clearActionOverlay(){document.querySelectorAll('.place-actions').forEach(e=>e.remove());}
    function renderGhost(){if(!placement)return;let ghost=worldLayer.querySelector('.ghost-machine');if(!ghost){ghost=document.createElement('div');ghost.className='machine ghost-machine';worldLayer.appendChild(ghost);}ghost.textContent=placement.item.icon;ghost.style.left=(placement.x*32-16)+'px';ghost.style.top=(placement.y*32-16)+'px';ghost.style.transform='rotate('+placement.rotation*90+'deg)';let act=worldLayer.querySelector('.placement-controls');if(!act){act=document.createElement('div');act.className='place-actions placement-controls';worldLayer.appendChild(act);}act.style.left=(placement.x*32)+'px';act.style.top=(placement.y*32-20)+'px';act.innerHTML='<button aria-label="Rotate">↻</button><button aria-label="Place">✓</button>';act.children[0].onclick=e=>{e.stopPropagation();placement.rotation=(placement.rotation+1)%4;renderGhost();};act.children[1].onclick=e=>{e.stopPropagation();placeMachine();};}
    function placeMachine(){if(!placement)return;const {item,x,y,rotation,existing}=placement;if(existing){machines.splice(machines.indexOf(existing),1);existing.el.remove();placement=null;eraseSelection=null;worldLayer.querySelector('.ghost-machine')?.remove();worldLayer.querySelector('.placement-controls')?.remove();toast('Deleted machine');return;}if(inSellZone(x,y)||machines.some(m=>m.x===x&&m.y===y)){toast('That tile is occupied');return;}if(inventoryCounts[item.id]<1){toast('Item not in inventory');cancelPlacement();return;}inventoryCounts[item.id]--;const el=document.createElement('div');el.className='machine '+item.type;el.textContent=item.icon;el.title=item.name;worldLayer.appendChild(el);const m={item,x,y,rotation,el,lastUse:0};machines.push(m);el.addEventListener('click',e=>{e.stopPropagation();if(m.item.type==='extractor'&&buildTool.classList.contains('active')&&!placement){const now=Date.now();if(now-m.lastUse<2000){toast('Extractor cooling down');return;}m.lastUse=now;mp+=1;updateMoney();toast('+1 MP');return;}if(document.querySelector('[data-tool="erase"]').classList.contains('active')){eraseSelection=m;placement=null;worldLayer.querySelector('.ghost-machine')?.remove();worldLayer.querySelector('.placement-controls')?.remove();renderEraseActions();toast('Confirm deletion with ✓');}});placement=null;eraseSelection=null;clearActionOverlay();worldLayer.querySelector('.ghost-machine')?.remove();worldLayer.querySelector('.placement-controls')?.remove();updateInventory();toast('Placed '+item.name);}
    function cancelPlacement(){placement=null;worldLayer.querySelector('.ghost-machine')?.remove();worldLayer.querySelector('.placement-controls')?.remove();}
    function renderEraseActions(){if(!eraseSelection)return;const m=eraseSelection;let act=worldLayer.querySelector('.erase-controls');if(!act){act=document.createElement('div');act.className='place-actions erase-controls';worldLayer.appendChild(act);}act.style.left=(m.x*32)+'px';act.style.top=(m.y*32-20)+'px';act.innerHTML='<button aria-label="Cancel">×</button><button aria-label="Delete">✓</button>';act.children[0].onclick=e=>{e.stopPropagation();eraseSelection=null;act.remove();};act.children[1].onclick=e=>{e.stopPropagation();const i=machines.indexOf(m);if(i>=0){machines.splice(i,1);m.el.remove();}eraseSelection=null;act.remove();toast('Deleted machine');};}
    canvas.addEventListener('click',e=>{if(placement){const p=gridCoords(e.clientX,e.clientY);placement.x=p.x;placement.y=p.y;renderGhost();}else eraseSelection=null;});
    function syncWorld(){renderWorld();}
    
    function updateInventory() {
      inventoryPanel.querySelector('.inventory-empty').textContent = Object.values(inventoryCounts).some(n=>n>0) ? '' : 'Inventory is empty';
      let container=inventoryPanel.querySelector('.inventory-items');
      if(!container){container=document.createElement('div');container.className='inventory-items';container.style.cssText='display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto;';inventoryPanel.insertBefore(container,inventoryResize);}
      container.innerHTML='';
      placeholderItems.forEach(item=>{if(!inventoryCounts[item.id])return;const row=document.createElement('button');row.style.cssText='border:1px solid #eee;border-radius:10px;padding:10px;background:#fff;color:#555;text-align:left;display:flex;justify-content:space-between;align-items:center;';row.innerHTML='<span>'+item.icon+' &nbsp; '+item.name+'</span><b>'+inventoryCounts[item.id]+'</b>';row.onclick=()=>{if(buildTool.classList.contains('active')){placement={item,rotation:0};toast('Tap the grid to preview placement');}};container.appendChild(row);});
    }
    function restoreShopSelection() { if(selectedShopItem===null)return; const item=placeholderItems[selectedShopItem]; const card=shopGrid.children[selectedShopItem]; if(item&&card)selectShopItem(item,card); }
    function openShop() { shopOverlay.classList.add('open'); restoreShopSelection(); }
    function closeShop() { shopOverlay.classList.remove('open'); }
    function selectShopItem(item,card) {
      selectedShopItem=placeholderItems.indexOf(item);
      shopGrid.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');
      shopDetailBody.innerHTML='<div class="shop-detail-icon">'+item.icon+'</div><div class="shop-detail-name">'+item.name+'</div><div class="shop-detail-description">'+item.description+'</div><div class="shop-card-price">'+priceFmt(item.price)+'</div>';
      const buy=document.querySelector('#shopBuy'); buy.disabled=mp<item.price; buy.textContent='Buy · '+priceFmt(item.price); document.querySelector('#shopBuyNote').textContent=mp>=item.price?'':'Not enough MP';
    }
    function refreshShopCards(){shopGrid.querySelectorAll('.shop-card').forEach((c,i)=>{const item=placeholderItems[i];c.querySelector('.shop-card-owned').textContent='Owned: '+inventoryCounts[item.id];c.querySelector('.shop-card-price').textContent=priceFmt(item.price);});if(selectedShopItem!==null)selectShopItem(placeholderItems[selectedShopItem],shopGrid.children[selectedShopItem]);}
    placeholderItems.forEach(item=>{
      const card=document.createElement('button');card.className='shop-card';
      card.innerHTML='<div class="shop-card-icon">'+item.icon+'</div><div class="shop-card-name">'+item.name+'</div><div class="shop-card-desc">'+item.description+'</div><div class="shop-card-price">'+priceFmt(item.price)+'</div><div class="shop-card-owned">Owned: 0</div>';
      card.onclick=()=>selectShopItem(item,card);shopGrid.appendChild(card);
    });
    function buySelected(){if(selectedShopItem===null)return;const item=placeholderItems[selectedShopItem];if(mp<item.price){toast('Not enough MP');return;}mp-=item.price;inventoryCounts[item.id]++;updateMoney();updateInventory();refreshShopCards();toast('Bought '+item.name);}
    document.querySelector('#shopBuy').addEventListener('click',buySelected);
    shopButton.addEventListener('click',openShop);document.querySelector('#shopClose').addEventListener('click',closeShop);
    shopOverlay.addEventListener('click',(e)=>{if(e.target===shopOverlay)closeShop();});
    shopOverlay.addEventListener('pointerdown', e => e.stopPropagation());
    shopOverlay.addEventListener('touchstart', e => e.stopPropagation(), {passive:true});
    buildTool.addEventListener('click', () => {setInventoryOpen(inventoryOpen);eraseSelection=null;clearActionOverlay();});
    document.querySelector('[data-tool="erase"]').addEventListener('click',()=>{cancelPlacement();eraseSelection=null;clearActionOverlay();});
    let resizing = false;
    inventoryResize.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizing = true;
      inventoryResize.setPointerCapture(e.pointerId);
    });
    inventoryResize.addEventListener('pointermove', (e) => {
      if (!resizing) return;
      const width = Math.max(200, Math.min(window.innerWidth * 0.45, e.clientX - inventoryPanel.getBoundingClientRect().left));
      inventoryPanel.style.width = width + 'px';
    });
    function stopResize() { resizing = false; }
    inventoryResize.addEventListener('pointerup', stopResize);
    inventoryResize.addEventListener('pointercancel', stopResize);

    const tools = document.querySelectorAll('.tool');
    const zoomValue = document.querySelector('#zoomValue');
    let zoom = 1, offsetX = 0, offsetY = 0;
    let drag = null;
    const pointers = new Map();
    let pinch = null;
    const grid = 32;
    const minZoom = 0.25, maxZoom = 4;

    function render() {
      const size = grid * zoom;
      canvas.style.backgroundSize = size + 'px ' + size + 'px';
      canvas.style.backgroundPosition = offsetX + 'px ' + offsetY + 'px';
      zoomValue.textContent = Math.round(zoom * 100) + '%';
      renderWorld();
    }
    function zoomAt(next, cx = innerWidth / 2, cy = innerHeight / 2) {
      next = Math.max(minZoom, Math.min(maxZoom, next));
      const factor = next / zoom;
      offsetX = cx - (cx - offsetX) * factor;
      offsetY = cy - (cy - offsetY) * factor;
      zoom = next;
      render();
    }
    const distance = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
    const midpoint = (a,b) => ({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      canvas.setPointerCapture(e.pointerId);
      if (pointers.size === 2) {
        const pts=[...pointers.values()];
        pinch={distance:distance(pts[0],pts[1]), zoom, center:midpoint(pts[0],pts[1]), ox:offsetX, oy:offsetY};
        drag=null;
        canvas.classList.remove('dragging');
      } else if (pointers.size === 1) {
        drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,id:e.pointerId};
        canvas.classList.add('dragging');
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if (pointers.size >= 2 && pinch) {
        const pts=[...pointers.values()];
        const currentDistance=distance(pts[0],pts[1]);
        const center=midpoint(pts[0],pts[1]);
        const next=Math.max(minZoom,Math.min(maxZoom,pinch.zoom*(currentDistance/pinch.distance)));
        const factor=next/pinch.zoom;
        offsetX=center.x-(pinch.center.x-pinch.ox)*factor;
        offsetY=center.y-(pinch.center.y-pinch.oy)*factor;
        zoom=next;
        render();
      } else if (drag && drag.id === e.pointerId) {
        offsetX=drag.ox+e.clientX-drag.x;
        offsetY=drag.oy+e.clientY-drag.y;
        render();
      }
    });
    function stopPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch=null;
      if (pointers.size === 1) {
        const [id,p]=[...pointers.entries()][0];
        drag={x:p.x,y:p.y,ox:offsetX,oy:offsetY,id};
        canvas.classList.add('dragging');
      } else {
        drag=null;
        canvas.classList.remove('dragging');
      }
    }
    canvas.addEventListener('pointerup',stopPointer);
    canvas.addEventListener('pointercancel',stopPointer);
    canvas.addEventListener('lostpointercapture',stopPointer);

    // Mouse wheel zoom; Shift+wheel pans horizontally.
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.shiftKey) {
        offsetX -= e.deltaY;
        render();
      } else {
        zoomAt(zoom * Math.exp(-e.deltaY * 0.002), e.clientX, e.clientY);
      }
    }, { passive: false });
    document.querySelector('#zoomIn').addEventListener('click', () => zoomAt(zoom * 1.2));
    document.querySelector('#zoomOut').addEventListener('click', () => zoomAt(zoom / 1.2));
    zoomValue.addEventListener('click', () => { zoom=1; offsetX=0; offsetY=0; render(); });
    tools.forEach((button) => button.addEventListener('click', () => {
      tools.forEach((tool) => tool.classList.remove('active'));
      button.classList.add('active');
      if (button.dataset.tool === 'build') {
        setInventoryOpen(inventoryOpen);
      } else {
        // Hide inventory and its reopen shortcut while Erase mode is active.
        inventoryPanel.classList.remove('open');
        inventoryShow.classList.remove('visible');
      }
    }));
    setInventoryOpen(true);
    render();
  </script></body>
</html>
